# =====================================================================
# Kick Hub — Netlify (CI/CD)
# ---------------------------------------------------------------------
# Site estático Vanilla JS: SEM comando de build. O app vive na subpasta
# kick-hub/, então é ela que é publicada.
#
# Sobre os .bak: eles estão no .gitignore, logo NÃO existem no repositório
# do GitHub — a Netlify (que faz deploy a partir do Git) nunca os recebe.
# =====================================================================

[build]
  publish = "kick-hub"
  command = ""            # Vanilla JS: nada para compilar

# Cabeçalhos de segurança em todas as respostas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Assets imutáveis podem ter cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# core.js, plugins, db/auth e config mudam: revalidar sempre.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
